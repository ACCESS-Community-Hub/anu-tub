# Payu configuration

# If submitting to a different project to your default, uncomment line below
# and change project code as appropriate; also set shortpath below
# project: <project>
# Force payu to always find, and save, files in this scratch project directory
# shortpath: /scratch/<project>

modules:
  use:
    - /g/data/vk83/prerelease/modules
  load:
    - access-om3/pr140-7

queue: normalsr
ncpus: 312
walltime: 3:00:00
jobname: tub-n8
project: tm70
shortpath: /scratch/ol01
storage:
  gdata:
    - ol01
    - x77
    
model: mom6
exe: mom6-solo
input:
  # Inputs can be created using the notebook in ./input
  - ./input/topog.nc
  - ./input/forcing.nc
  - ./input/sst.nc

runlog: true
metadata:
  enable: true
manifest:
  reproduce:
    exe: true

collate: false

sync:
  enable: true
  path:
    /g/data/x77/amh157/anu-tub/outputs/anu-tub-zstar-n8
  restart: false
  remove_local_dirs: true

qsub_flags: -W umask=027

restart_freq: 5

